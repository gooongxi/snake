name: Build and publish Snake
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snake-gh-pages
  cancel-in-progress: false
jobs:
  build-pygbag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build game
        run: |
          python -m pip install pygbag==0.9.3
          python -m pygbag --build ./game
      - name: Publish game to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: game/build/web
